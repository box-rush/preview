  --bg:#F6F6F2; --surface:#FFFFFF; --ink:#1A1A1A; --ink-2:#666; --line:#E3E2DB; --track:#ECEBE4;
  --accent:#3B3FD8; --accent-ink:#FFFFFF; --accent-soft:#ECEDFC;

  --accent:#8E91F7; --accent-ink:#111214; --accent-soft:#23244A; --trust:#3CC4B0; --trust-soft:#15302C; --warn:#F0A73A; --warn-soft:#3A2C12; --error:#EF6B6B; --error-soft:#3A1C1C;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#111214; --surface:#1A1B1E; --ink:#F2F2F2; --ink-2:#A0A0A0; --line:#2A2B2F; --track:#2A2B2F;
  --accent:#8E91F7; --accent-ink:#111214; --accent-soft:#23244A; --trust:#3CC4B0; --trust-soft:#15302C; --warn:#F0A73A; --warn-soft:#3A2C12; --error:#EF6B6B; --error-soft:#3A1C1C;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)} .muted{color:var(--ink-2)} .small{font-size:12px}
.proto{background:var(--ink);color:var(--bg);font-size:12px}
.proto summary{padding:6px 16px;cursor:pointer;list-style:none}
.proto summary::-webkit-details-marker{display:none}
/* ---------- admin shell (merchant / ops, desktop-first) ---------- */
.adm{display:grid;grid-template-columns:1fr;min-height:100vh;background:var(--bg)}
.side-nav{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;overflow-x:auto}
.side-nav .brand{font-weight:900;font-size:16px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.side-nav .brand i{font-style:normal;background:var(--accent);color:var(--accent-ink);padding:0 5px;border-radius:5px;font-family:var(--mono);font-size:13px}
.side-nav .brand small{font-size:11px;color:var(--ink-2);font-weight:700;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.side-nav nav{display:flex;gap:2px}
.side-nav nav a{white-space:nowrap;padding:6px 10px;border-radius:8px;font-size:13px;color:var(--ink-2)}
.side-nav nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.side-nav nav a:hover{background:var(--track)}
.side-nav .who{margin-left:auto;font-size:12px;color:var(--ink-2);white-space:nowrap}
.main{min-width:0;padding:16px;display:flex;flex-direction:column;gap:14px}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:20px;font-weight:900}
.ph .sub{font-size:12.5px;color:var(--ink-2)}
.ph .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{margin:0;font-size:14.5px;font-weight:900;display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 12px;min-height:36px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ok{background:var(--trust);color:#fff;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pill.ok{background:var(--trust-soft);color:var(--trust)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--error-soft);color:var(--error)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.mute{background:var(--track);color:var(--ink-2)}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:10px}
.tbl table{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{position:sticky;top:0;background:var(--surface);font-size:11.5px;color:var(--ink-2);z-index:1}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl tr[data-row]{cursor:pointer}
.tbl tr[data-row]:hover td{background:var(--track)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;min-height:30px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--mono);font-size:24px;line-height:1.1}
.kpi span{font-size:12px;color:var(--ink-2)}
@media (min-width:1024px){
  .adm{grid-template-columns:220px minmax(0,1fr)}
  .side-nav{flex-direction:column;align-items:stretch;border-bottom:0;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;gap:14px}
  .side-nav nav{flex-direction:column}
  .side-nav nav a{padding:8px 10px}
  .side-nav .who{margin-left:0;margin-top:auto}
  .main{padding:20px 24px}
}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:700;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button b{font-family:var(--mono);font-size:12px;margin-left:4px}
.scanbar{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.scanbar input{flex:1;min-width:240px;min-height:52px;border:2px solid var(--accent);border-radius:10px;background:var(--surface);padding:0 14px;font-family:var(--mono);font-size:18px}
.hint{display:flex;align-items:center;gap:14px;background:var(--accent-soft);border-radius:12px;padding:14px 16px;flex-wrap:wrap}
.hint .bin{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--accent)}
.bins{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.bin-c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.bin-c b{font-family:var(--mono);font-size:16px}
.bin-c .bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bin-c .bar i{display:block;height:100%;background:var(--trust)}
.bin-c.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kchip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;background:var(--surface)}
.kchip b{font-family:var(--mono)}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.req{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.req:hover{border-color:var(--ink-2)}
.req .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.req .code{font-family:var(--mono);font-weight:700}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.items li{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.items li.ok{background:var(--trust-soft);border-color:transparent}
.items .ic{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:12px}
.items li.ok .ic{background:var(--trust);border-color:var(--trust);color:#fff}
.items .bc{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.rulebox{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:13px}
.pk{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:1100px){.pk{grid-template-columns:320px minmax(0,1fr)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12.5px;padding:8px 14px;border-radius:999px;z-index:40}
</style>
