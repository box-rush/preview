<style>
:root{
  --bg:#F6F6F2; --surface:#FFFFFF; --ink:#1A1A1A; --ink-2:#666; --line:#E3E2DB; --track:#ECEBE4;
  --accent:#3B3FD8; --accent-ink:#FFFFFF; --accent-soft:#ECEDFC;
  --trust:#0F9D8A; --trust-soft:#E1F3F0; --warn:#B77400; --warn-soft:#FBF0DC; --error:#C93C3C; --error-soft:#FBE7E7;
  --sans:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,system-ui,sans-serif;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#111214; --surface:#1A1B1E; --ink:#F2F2F2; --ink-2:#A0A0A0; --line:#2A2B2F; --track:#2A2B2F;
  --accent:#8E91F7; --accent-ink:#111214; --accent-soft:#23244A; --trust:#3CC4B0; --trust-soft:#15302C; --warn:#F0A73A; --warn-soft:#3A2C12; --error:#EF6B6B; --error-soft:#3A1C1C;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#111214; --surface:#1A1B1E; --ink:#F2F2F2; --ink-2:#A0A0A0; --line:#2A2B2F; --track:#2A2B2F;
  --accent:#8E91F7; --accent-ink:#111214; --accent-soft:#23244A; --trust:#3CC4B0; --trust-soft:#15302C; --warn:#F0A73A; --warn-soft:#3A2C12; --error:#EF6B6B; --error-soft:#3A1C1C;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)} .muted{color:var(--ink-2)} .small{font-size:12px}
.proto{background:var(--ink);color:var(--bg);font-size:12px}
.proto summary{padding:6px 16px;cursor:pointer;list-style:none}
.proto summary::-webkit-details-marker{display:none}
/* ---------- admin shell (merchant / ops, desktop-first) ---------- */
.adm{display:grid;grid-template-columns:1fr;min-height:100vh;background:var(--bg)}
.side-nav{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;overflow-x:auto}
.side-nav .brand{font-weight:900;font-size:16px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.side-nav .brand i{font-style:normal;background:var(--accent);color:var(--accent-ink);padding:0 5px;border-radius:5px;font-family:var(--mono);font-size:13px}
.side-nav .brand small{font-size:11px;color:var(--ink-2);font-weight:700;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.side-nav nav{display:flex;gap:2px}
.side-nav nav a{white-space:nowrap;padding:6px 10px;border-radius:8px;font-size:13px;color:var(--ink-2)}
.side-nav nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.side-nav nav a:hover{background:var(--track)}
.side-nav .who{margin-left:auto;font-size:12px;color:var(--ink-2);white-space:nowrap}
.main{min-width:0;padding:16px;display:flex;flex-direction:column;gap:14px}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:20px;font-weight:900}
.ph .sub{font-size:12.5px;color:var(--ink-2)}
.ph .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{margin:0;font-size:14.5px;font-weight:900;display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 12px;min-height:36px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ok{background:var(--trust);color:#fff;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pill.ok{background:var(--trust-soft);color:var(--trust)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--error-soft);color:var(--error)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.mute{background:var(--track);color:var(--ink-2)}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:10px}
.tbl table{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{position:sticky;top:0;background:var(--surface);font-size:11.5px;color:var(--ink-2);z-index:1}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl tr[data-row]{cursor:pointer}
.tbl tr[data-row]:hover td{background:var(--track)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;min-height:30px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--mono);font-size:24px;line-height:1.1}
.kpi span{font-size:12px;color:var(--ink-2)}
@media (min-width:1024px){
  .adm{grid-template-columns:220px minmax(0,1fr)}
  .side-nav{flex-direction:column;align-items:stretch;border-bottom:0;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;gap:14px}
  .side-nav nav{flex-direction:column}
  .side-nav nav a{padding:8px 10px}
  .side-nav .who{margin-left:0;margin-top:auto}
  .main{padding:20px 24px}
}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:700;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button b{font-family:var(--mono);font-size:12px;margin-left:4px}
.scanbar{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.scanbar input{flex:1;min-width:240px;min-height:52px;border:2px solid var(--accent);border-radius:10px;background:var(--surface);padding:0 14px;font-family:var(--mono);font-size:18px}
.hint{display:flex;align-items:center;gap:14px;background:var(--accent-soft);border-radius:12px;padding:14px 16px;flex-wrap:wrap}
.hint .bin{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--accent)}
.bins{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.bin-c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.bin-c b{font-family:var(--mono);font-size:16px}
.bin-c .bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bin-c .bar i{display:block;height:100%;background:var(--trust)}
.bin-c.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kchip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;background:var(--surface)}
.kchip b{font-family:var(--mono)}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.req{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.req:hover{border-color:var(--ink-2)}
.req .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.req .code{font-family:var(--mono);font-weight:700}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.items li{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.items li.ok{background:var(--trust-soft);border-color:transparent}
.items .ic{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:12px}
.items li.ok .ic{background:var(--trust);border-color:var(--trust);color:#fff}
.items .bc{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.rulebox{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:13px}
.pk{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:1100px){.pk{grid-template-columns:320px minmax(0,1fr)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12.5px;padding:8px 14px;border-radius:999px;z-index:40}
</style>
</head>

<script>
/* ---------- L009 mock opening data (deterministic, shared by ui-14 / ui-15 / ui-16) ---------- */
function rng9(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R9=rng9(20260926);
const P9=60, C9=5, SEAL9=90, DRAW9=150, PACK9=40, DUR9=DRAW9+P9*PACK9+60;
const SLOTS9=["ブラッキー枠","ニンフィア枠","エーフィ枠","リーフィア枠","グレイシア枠","シャワーズ枠","サンダース枠","ブースター枠","イーブイ枠","その他ポケモン（ex）枠","その他ポケモン枠","トレーナーズ・エネルギー枠"];
const USERS9=["61d0","a7e3","f2c8","0e47","9b13","4ad6","c7f0","2e95","88b1","d04c","5f6a","37e2"];
const CH9=[["ブラッキー",1],["ニンフィア",2],["エーフィ",3],["リーフィア",4],["グレイシア",5],["シャワーズ",6],["サンダース",7],["ブースター",8],["イーブイ",9]];
const OT9=["ラルトス","ヒトカゲ","ポッチャマ","ゾロア","ミミッキュ","ルカリオ","カビゴン","ゲンガー","ガブリアス","ピカチュウ"];
const TR9=["ネストボール","ハイパーボール","ナンジャモ","ペパー","ボスの指令","基本超エネルギー","基本悪エネルギー","ふしぎなアメ","すごいつりざお","ジャッジマン"];
const RAR9=[["C",.5],["U",.25],["R",.11],["RR",.08],["AR",.04],["SR",.015],["SAR",.005]];
function rar9(){let x=R9(),a=0;for(const [r,p] of RAR9){a+=p;if(x<a)return r;}return "C";}
const CARDS9=[];
for(let p=1;p<=P9;p++){for(let k=0;k<C9;k++){
  const i=CARDS9.length, t=DRAW9+(p-1)*PACK9+8+k*6; let r=k===4?rar9():(R9()<.7?"C":"U"), name, slot;
  const kind=R9();
  if(kind<.25){name=TR9[Math.floor(R9()*TR9.length)];slot=12;if(r==="RR"||r==="AR")r="U";}
  else if(kind<.6){const c=CH9[Math.floor(R9()*CH9.length)];const ex=(r==="RR"||r==="SR"||r==="SAR")&&R9()<.8;name=c[0]+(ex?"ex":"");slot=c[1];}
  else{const o=OT9[Math.floor(R9()*OT9.length)];const ex=(r==="RR"||r==="SR"||r==="SAR")&&R9()<.8;name=o+(ex?"ex":"");slot=ex?10:11;}
  const hi=r==="SR"||r==="SAR"||r==="AR";
  const no=hi?String(160+Math.floor(R9()*40))+"/159":String(1+Math.floor(R9()*159)).padStart(3,"0")+"/159";
  let status="auto", cand=null, note="";
  if(i%53===17){status="review";const alt=slot===11?10:(slot>=1&&slot<=9?11:9);cand=[slot,alt];note="カード番号の読み取り信頼度が低い（"+(62+Math.floor(R9()*20))+"%）";}
  CARDS9.push({i,t,pack:p,name,no,r,slot,status,cand,note});
}}
/* one off-list card (fallback rule: assigned in opening order starting from slot #01) */
{const c=CARDS9[23*C9+1]; c.name="エラー印刷カード（番号なし）"; c.no="—"; c.r="?"; c.status="outside"; c.slot=1; c.cand=[1]; c.note="分位リストにないカード。上架時の兜底ルールで #01 に割り当て";}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
/* inbound: L009 cards after attribution, shelved into the owner's bin */
const BIN=u=>`A-${pad(USERS9.indexOf(u)+1)}-${pad(10+USERS9.indexOf(u)*3)}`;
const IN=CARDS9.map(c=>({c,user:USERS9[c.slot-1],bin:BIN(USERS9[c.slot-1]),done:false}));
let inIdx=0, lastBin=null;
/* shipping requests (k = items per shipment) */
const REQ=[
 {id:"S-2609-0141",user:"a7e3",name:"山田 花子",bin:"A-02-13",ins:true,items:[["ルギアV","202/172","SAR"],["ポッチャマ","045/172","C"],["リーリエの全力","210/172","SR"]]},
 {id:"S-2609-0142",user:"5c19",name:"ユーザー 5c19",bin:"B-07-04",ins:false,items:[["ナンジャモ","096/190","U"],["ネストボール","181/190","U"],["ミミッキュ","097/190","C"],["ゲンガー","104/190","R"],["基本超エネルギー","—","C"]]},
 {id:"S-2609-0143",user:"e0b4",name:"ユーザー e0b4",bin:"B-03-11",ins:false,items:[["カビゴン","143/165","U"],["ヒトカゲ","004/165","C"]]},
 {id:"S-2609-0144",user:"17fa",name:"ユーザー 17fa",bin:"C-01-02",ins:true,items:[["リザードンex","201/165","SAR"],["ピカチュウ","025/165","C"],["フシギダネ","001/165","C"],["ゼニガメ","007/165","C"]]},
 {id:"S-2609-0145",user:"9d22",name:"ユーザー 9d22",bin:"C-04-09",ins:false,items:[["ペパー","185/190","U"],["ハイパーボール","182/190","U"],["パモ","075/190","C"],["ホゲータ","024/190","C"],["クワッス","053/190","C"],["ニャオハ","013/190","C"]]},
 {id:"S-2609-0146",user:"c3e8",name:"ユーザー c3e8",bin:"D-02-06",ins:false,items:[["ボスの指令","172/190","U"]]},
 {id:"S-2609-0147",user:"6b40",name:"ユーザー 6b40",bin:"D-05-01",ins:false,items:[["ドラパルト","130/190","R"],["サーナイト","086/190","U"],["ラルトス","084/190","C"]]}
].map(r=>({...r,items:r.items.map(([n,no,rr],i)=>({n,no,r:rr,bc:`${r.id.slice(-4)}-${pad(i+1)}`,ok:false})),packed:false,tracking:null}));
const OUT=[{id:"S-2609-0131",name:"ユーザー 2a97",n:4,at:"9/26 11:20",tr:"4421-0101-3307"},{id:"S-2609-0128",name:"ユーザー f81d",n:2,at:"9/26 10:05",tr:"4421-0101-2289"}];
let tab="in", cur=REQ[0].id;
const TABS=[["in","入庫（振り分け後）"],["req","出荷依頼"],["pack","梱包"],["out","出荷済"]];
const k=()=>{const open=REQ.filter(r=>!r.packed);return open.length?(open.reduce((a,r)=>a+r.items.length,0)/open.length):0;};

function tabs(){const c={in:IN.filter(x=>!x.done).length,req:REQ.filter(r=>!r.packed).length,pack:REQ.filter(r=>!r.packed&&r.items.some(i=>i.ok)).length,out:OUT.length+REQ.filter(r=>r.packed).length};
  document.getElementById("tabs").innerHTML=TABS.map(([k2,v])=>`<button type="button" role="tab" data-tab="${k2}" aria-selected="${k2===tab}">${v}<b>${c[k2]}</b></button>`).join("");}
function paneIn(){
  const bins={}; IN.forEach(x=>{(bins[x.bin]=bins[x.bin]||{bin:x.bin,user:x.user,n:0,d:0});bins[x.bin].n++;if(x.done)bins[x.bin].d++;});
  const left=IN.length-IN.filter(x=>x.done).length, next=IN.find(x=>!x.done);
  return `<section class="card"><h2>入庫 · L009（振り分け完了 9/26 21:10）</h2>
    <div class="scanbar"><input id="scan" placeholder="カードのラベルをスキャン（Enter）" aria-label="スキャン" autocomplete="off"><button class="btn" type="button" id="bulk">原型：残りを一括入庫</button></div>
    ${lastBin?`<div class="hint"><span class="small">直前のカード</span><b>${esc(lastBin.c.name)}</b><span class="mono small">${lastBin.c.no}</span><span class="small">→ 棚</span><span class="bin">${lastBin.bin}</span><span class="small muted">user_${lastBin.user}…</span></div>`:
      `<div class="hint"><span>スキャンすると、そのカードを入れる棚番号が表示されます</span></div>`}
    <span class="small muted">残り ${left} 枚 / ${IN.length} 枚${next?` · 次：${esc(next.c.name)} ${next.c.no}`:""}</span>
    <div class="bins">${Object.values(bins).map(b=>`<div class="bin-c ${lastBin&&lastBin.bin===b.bin?"on":""}"><b>${b.bin}</b><span class="small muted">user_${b.user}…</span><span class="bar"><i style="width:${b.d/b.n*100}%"></i></span><span class="small">${b.d} / ${b.n} 枚</span></div>`).join("")}</div></section>`;
}
function paneReq(){
  const open=REQ.filter(r=>!r.packed), total=open.reduce((a,r)=>a+r.items.length,0);
  return `<section class="card"><div class="kpis"><span class="kchip">平均まとめ件数 <b>k = ${k().toFixed(1)}</b></span><span class="kchip">依頼 <b>${open.length}</b> 件 · <b>${total}</b> 点</span><span class="kchip">補償付き <b>${open.filter(r=>r.ins).length}</b> 件</span></div>
    <div class="reqs">${open.map(r=>`<button type="button" class="req" data-req="${r.id}"><span class="top"><span class="code">${r.id}</span>${r.ins?`<span class="pill warn">補償付き</span>`:`<span class="pill mute">通常</span>`}</span>
      <span>${esc(r.name)}</span><span class="small muted">${r.items.length} 点 · 棚 <span class="mono">${r.bin}</span></span></button>`).join("")||`<span class="muted">依頼はありません</span>`}</div></section>`;
}
function panePack(){
  const r=REQ.find(x=>x.id===cur)||REQ.find(x=>!x.packed);
  if(!r||r.packed) return `<section class="card"><span class="muted">梱包する依頼を「出荷依頼」から選んでください</span></section>`;
  const all=r.items.every(i=>i.ok), hi=r.ins||r.items.some(i=>i.r==="SR"||i.r==="SAR");
  return `<div class="pk"><section class="card"><h2>依頼 ${r.id}</h2><span>${esc(r.name)}</span><span class="small muted">棚 <span class="mono">${r.bin}</span> · ${r.items.length} 点</span>
      ${hi?`<div class="rulebox"><b>高額カードの梱包ルール</b><br>スリーブ → トップローダー → 防水袋の順に入れ、${r.ins?"補償付き配送で":"追跡付きで"}発送します。</div>`:""}
      <button class="btn pri" type="button" id="label" ${all?"":"disabled"}>送り状を印刷して出荷</button>
      ${all?"":`<span class="small muted">すべてのカードをスキャンすると印刷できます</span>`}</section>
    <section class="card"><h2>梱包チェック</h2><div class="scanbar"><input id="scan" placeholder="カードのラベルをスキャン（Enter）" aria-label="スキャン" autocomplete="off"></div>
      <ul class="items">${r.items.map(i=>`<li class="${i.ok?"ok":""}"><span class="ic">${i.ok?"✓":""}</span><span>${esc(i.n)} <span class="mono small muted">${i.no}</span></span><span class="mono small">${i.r}</span><span class="bc">${i.bc}</span></li>`).join("")}</ul></section></div>`;
}
function paneOut(){
  const rows=REQ.filter(r=>r.packed).map(r=>({id:r.id,name:r.name,n:r.items.length,at:"9/26 18:0"+(REQ.indexOf(r)%10),tr:r.tracking})).concat(OUT);
  return `<section class="card"><div class="tbl"><table><thead><tr><th>依頼</th><th>宛先</th><th>点数</th><th>出荷</th><th>追跡番号</th></tr></thead>
    <tbody>${rows.map(o=>`<tr><td class="mono">${o.id}</td><td>${esc(o.name)}</td><td class="mono">${o.n}</td><td class="mono">${o.at}</td><td class="mono">${o.tr}</td></tr>`).join("")}</tbody></table></div></section>`;
}
function render(){
  tabs(); const p=document.getElementById("pane");
  p.innerHTML=tab==="in"?paneIn():tab==="req"?paneReq():tab==="pack"?panePack():paneOut();
  const sc=document.getElementById("scan"); if(sc){sc.focus(); sc.addEventListener("keydown",e=>{if(e.key!=="Enter")return;e.preventDefault();scan();});}
  const b=document.getElementById("bulk"); if(b) b.onclick=()=>{IN.forEach(x=>x.done=true);lastBin=null;render();say("入庫完了（原型）");};
  const lb=document.getElementById("label"); if(lb) lb.onclick=()=>{const r=REQ.find(x=>x.id===cur);r.packed=true;r.tracking="4421-0101-"+String(4000+REQ.indexOf(r)*37);say(`送り状を印刷しました（原型）· 追跡番号 ${r.tracking}`);const nx=REQ.find(x=>!x.packed);cur=nx?nx.id:null;render();};
}
function scan(){
  if(tab==="in"){const x=IN.find(y=>!y.done); if(!x){say("入庫待ちのカードはありません");return;} x.done=true; lastBin=x; render();}
  else if(tab==="pack"){const r=REQ.find(x=>x.id===cur); const i=r&&r.items.find(y=>!y.ok); if(!i){say("この依頼はすべてスキャン済みです");return;} i.ok=true; render();}
}
document.addEventListener("click",e=>{
  const p=e.target.closest("[data-proto]"); if(p){e.preventDefault();say(`原型：「${p.dataset.proto}」尚未生成`);return;}
  const t=e.target.closest("[data-tab]"); if(t){location.hash=t.dataset.tab;return;}
  const r=e.target.closest("[data-req]"); if(r){cur=r.dataset.req;location.hash="pack";}
});
const toast=document.getElementById("toast"); let tt;
function say(m){toast.textContent=m;toast.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toast.hidden=true,2600);}
function route(){const h=(location.hash||"#in").slice(1);tab=TABS.some(x=>x[0]===h)?h:"in";render();}
window.addEventListener("hashchange",route); route();
</script>
</body>
</html>
