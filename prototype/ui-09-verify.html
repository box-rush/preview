5", "user_c3e8#17", "user_2a97#22", "user_d6c5#25", "user_9d22#12", "user_40ee#29", "user_f81d#20", "user_40ee#30"]}};

 L015:{title:"ポケカ『ナイトワンダラー』1BOX パック番号",mode:"RANDOM",commitAt:"9/17(木) 10:00",fullAt:"9/23(水) 21:12",drawAt:"9/23(水) 21:14",openAt:"9/24(木) 20:00",

 L011:["ピカチュウ枠","リザードン枠","テラパゴス枠","ミュウ枠","ミライドン枠","コライドン枠","ルカリオ枠","ゲンガー枠","ニンフィア枠","その他ポケモン（ex）枠","その他ポケモン枠","トレーナーズ・エネルギー枠"]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function sha256(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}

const PY=`import hashlib
H = lambda s: hashlib.sha256(s.encode()).hexdigest()

def verify(server_seed, commit, participants_text, participants_hash, beacon, assignment):
    assert H(server_seed) == commit                    # ① コミットと一致
    assert H(participants_text) == participants_hash   # ② 参加者リストと一致
    units = participants_text.split("\\n")
    final = H(server_seed + "|" + participants_hash + "|" + beacon)
    arr = list(range(len(units)))
    for i in range(len(units) - 1, 0, -1):             # ③ Fisher–Yates
        j = int(H(final + ":" + str(i))[:8], 16) % (i + 1)
        arr[i], arr[j] = arr[j], arr[i]
    assert [units[k] for k in arr] == assignment       # ④ 割り当てと一致
    return True`;

function lotView(id){

  const inputs=[item("シードのハッシュ（コミット・"+m.commitAt+" 公開）",d.commit),item("サーバーシード（"+m.drawAt+" に公開）",d.serverSeed),
    item("参加者リスト"+(rnd?"（購入順・1行1枠）":"（枠番号:保有者）"),d.participantsText),item("参加者リストのハッシュ",d.participantsHash)];
  if(rnd) inputs.push(item("外部ビーコン（"+m.beacon.source+"・ラウンド "+m.beacon.round+"・"+m.beacon.fetchedAt+" 取得）",d.beacon));
  inputs.push(`<div class="item"><span class="k">アルゴリズム</span><span class="v">${m.algo}${rnd?"：final = SHA-256(seed|participantsHash|beacon)、Fisher–Yates（j = SHA-256(final:i) 先頭 8 桁 mod (i+1)）":"：枠は購入時に選択。抽選は行わず、シードは記録の改ざん防止に使用"}</span></div>`);
  const assignRows=rnd?d.assignment.map((u,k)=>`<tr class="${u.startsWith(m.me)?"me":""}"><td class="mono">パック ${String(k+1).padStart(2,"0")}</td><td class="mono">${esc(u.replace(/#\d+$/,""))}…${u.startsWith(m.me)?" （あなた）":""}</td></tr>`).join("")
    :d.participantsText.split("\n").map(l=>{const [n,u]=l.split(":");return `<tr class="${u===m.me?"me":""}"><td class="mono">#${n} ${esc(SLOTN[id][+n-1])}</td><td class="mono">${esc(u)}…${u===m.me?" （あなた）":""}</td></tr>`;}).join("");
  document.getElementById("main").innerHTML=`<div class="page">
    <section class="blk">
      <span class="mode">${rnd?"ランダム割り当て":"枠を選んで購入"}</span>
      <h1>${esc(m.title)}</h1>
      <div class="meta"><span>開封会 ID <b class="mono">${id}</b></span><span>満員 ${m.fullAt}</span><span>開封 ${m.openAt}</span></div>
      <div class="links"><button class="btn" type="button" id="share"><svg class="i"><use href="#i-share"/></svg>この検証ページを共有</button>
        ${m.video?`<a class="btn" href="ui-07-recording.html#${id}"><svg class="i"><use href="#i-video"/></svg>開封映像を見る</a>`:`<a class="btn" href="#video" data-proto="開封映像（${id}）"><svg class="i"><use href="#i-video"/></svg>開封映像を見る</a>`}
        <a class="btn" href="#spec" data-proto="アルゴリズム仕様"><svg class="i"><use href="#i-doc"/></svg>アルゴリズム仕様</a></div>

    <section class="blk"><h2>しくみ</h2><ol class="steps">

      <li><span class="n">2</span><span>満員後に参加者と外部ビーコンを合成</span></li>
      <li><span class="n">3</span><span>公開アルゴリズムで割り当てを計算 → 誰でも再計算できます</span></li></ol>
      ${rnd?"":`<p class="small muted" style="margin:0">この開封会は枠を選んで購入する方式のため、ステップ 2〜3 の抽選はありません。シードと参加者リストのハッシュで、記録が後から変えられていないことを確認します。</p>`}</section>
    <div class="grid2">
      <section class="blk"><h2>入力（すべて公開）</h2><div class="kv">${inputs.join("")}</div></section>
      <div style="display:flex;flex-direction:column;gap:14px">
        <section class="blk run"><h2>ブラウザで再計算する</h2>
          <button class="primary" type="button" id="run">ブラウザで再計算する</button>
          <ul class="res" id="res" aria-live="polite"></ul><div id="verdict"></div>
          <label class="small muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="tamper">原型：改ざんされた値で試す（シードを 1 文字変更）</label></section>
        <section class="blk"><h2>割り当て（${m.drawAt} 公開）</h2><div class="tblwrap"><table><thead><tr><th>${rnd?"パック番号":"枠"}</th><th>保有者（匿名化）</th></tr></thead><tbody>${assignRows}</tbody></table></div></section>
      </div>
    </div>
    <section class="blk"><details class="script"><summary>検証スクリプト（Python）</summary>
      <p class="small muted" style="margin:6px 0 0">上の入力をそのまま渡すと、このページと同じ計算を手元で再現できます。</p>
      <pre id="py"></pre><button class="btn" type="button" id="copy-py" style="margin-top:8px">スクリプトをコピー</button></details></section>
  </div>`;
  document.getElementById("py").textContent=PY;
  document.getElementById("run").onclick=()=>run(id);
  document.getElementById("share").onclick=()=>copy(location.href,"ページの URL をコピーしました");
  document.getElementById("copy-py").onclick=()=>copy(PY,"スクリプトをコピーしました");
}

async function run(id){
  const d=DATA[id], rnd=META[id].mode==="RANDOM", tamper=document.getElementById("tamper").checked;
  const res=document.getElementById("res"), btn=document.getElementById("run"); btn.disabled=true; res.innerHTML=""; document.getElementById("verdict").innerHTML="";
  const seed=tamper?d.serverSeed.slice(0,-1)+"X":d.serverSeed; let allOk=true;
  const add=(ok,label,detail)=>{allOk=allOk&&ok;res.insertAdjacentHTML("beforeend",`<li class="${ok?"ok":"ng"}"><span class="ic">${ok?"✓":"✕"}</span><span>${label}<span class="d">${detail}</span></span></li>`);};
  const h1=await sha256(seed); add(h1===d.commit,"ハッシュ一致（シード → コミット）",`SHA-256(seed) = ${h1}`);
  const h2=await sha256(d.participantsText); add(h2===d.participantsHash,"参加者リスト一致",`SHA-256(list) = ${h2}`);
  if(rnd){
    const units=d.participantsText.split("\n"), fin=await sha256(seed+"|"+h2+"|"+d.beacon), arr=units.map((_,i)=>i);
    for(let i=units.length-1;i>0;i--){const j=parseInt((await sha256(fin+":"+i)).slice(0,8),16)%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];}
    const got=arr.map(k=>units[k]), diff=got.findIndex((u,k)=>u!==d.assignment[k]);
    add(diff<0,"割り当て一致",diff<0?`final = ${fin}`:`パック ${diff+1}：計算 ${got[diff]} / 公開 ${d.assignment[diff]}`);
  }
  document.getElementById("verdict").innerHTML=allOk?`<div class="verdict ok">✓ 公開された結果と一致しました</div>`:`<div class="verdict ng">✕ 一致しない項目があります（詳細は上記）</div>`;
  btn.disabled=false;
}

async function copy(text,msg){try{await navigator.clipboard.writeText(text);say(msg);}catch(e){say("コピーできませんでした。手動で選択してください");}}
document.addEventListener("click",e=>{const c=e.target.closest("[data-copy]");if(c){copy(c.dataset.copy,"コピーしました");return;}
  const p=e.target.closest("[data-proto]");if(p){e.preventDefault();say(`原型：「${p.dataset.proto}」尚未生成`);}});
const toast=document.getElementById("toast"); let tt;
function say(m){toast.textContent=m;toast.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toast.hidden=true,2600);}
function route(){const h=(location.hash||"").slice(1).toUpperCase(); if(DATA[h]) lotView(h); else entryView(); scrollTo(0,0);}
window.addEventListener("hashchange",route); route();
</script>
