<style>
/* Tokens: docs/breaking-platform.md §9.2 */
:root{
  --gut:16px;
  --ground:#EEEEE8;
  --bg:#FAFAF7; --surface:#FFFFFF; --ink:#1A1A1A; --ink-2:#6B6B6B; --line:#E6E5DE; --track:#ECEBE4;
  --accent:#3B3FD8; --accent-ink:#FFFFFF; --accent-soft:#ECEDFC;
  --trust:#0F9D8A; --trust-soft:#E1F3F0;
  --error:#C93C3C; --error-soft:#FBE7E7;
  --code:#F3F2EC;
  --sans:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0A0B0C;
    --bg:#111214; --surface:#1A1B1E; --ink:#F2F2F2; --ink-2:#A0A0A0; --line:#2A2B2F; --track:#2A2B2F;
    --accent:#8E91F7; --accent-ink:#111214; --accent-soft:#23244A;
    --trust:#3CC4B0; --trust-soft:#15302C;
    --error:#EF6B6B; --error-soft:#3A1C1C;
    --code:#141518;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0A0B0C;
  --bg:#111214; --surface:#1A1B1E; --ink:#F2F2F2; --ink-2:#A0A0A0; --line:#2A2B2F; --track:#2A2B2F;
  --accent:#8E91F7; --accent-ink:#111214; --accent-soft:#23244A;
  --trust:#3CC4B0; --trust-soft:#15302C;
  --error:#EF6B6B; --error-soft:#3A1C1C;
  --code:#141518;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}
.small{font-size:12px}
.muted{color:var(--ink-2)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:32px}
.proto{background:var(--ink);color:var(--bg);font-size:12px}
.proto summary{padding:6px 16px;cursor:pointer;list-style:none}
.proto summary::-webkit-details-marker{display:none}
/* public header: no tab bar */
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.bar{display:flex;align-items:center;gap:10px;padding:12px var(--gut);max-width:980px;margin:0 auto}
.mark b{font-weight:900;font-size:18px;display:flex;align-items:center;gap:1px}
.mark b i{font-style:normal;background:var(--accent);color:var(--accent-ink);padding:0 5px;border-radius:5px;margin-right:2px;font-family:var(--mono);font-size:15px;line-height:1.35}
.bar .pub{margin-left:auto;font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:4px}
.bar .pub svg{width:14px;height:14px;color:var(--trust)}

.page{display:flex;flex-direction:column;gap:14px;padding:16px var(--gut) 0;max-width:980px;margin:0 auto}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.blk h2{margin:0;font-size:15px;font-weight:900}
h1{margin:0;font-size:19px;font-weight:900;line-height:1.4}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2)}
.mode{display:inline-flex;font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;background:var(--accent-soft);color:var(--accent)}

.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:8px}
.steps li{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px}
.steps .n{width:24px;height:24px;border-radius:50%;background:var(--trust);color:#fff;display:grid;place-items:center;font-weight:900;font-size:12px;flex:none}

.kv{display:flex;flex-direction:column;gap:8px}
.kv .item{display:flex;flex-direction:column;gap:3px}
.kv .k{font-size:11.5px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.kv .v{font-family:var(--mono);font-size:12px;background:var(--code);border-radius:6px;padding:7px 9px;overflow-wrap:anywhere;white-space:pre-wrap}
.copy{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 8px;font-size:11px;cursor:pointer;min-height:26px}

.run{display:flex;flex-direction:column;gap:10px}
.primary{min-height:48px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:15px;cursor:pointer;width:100%}
.primary:disabled{background:var(--track);color:var(--ink-2)}
.res{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.res li{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;border-radius:8px;padding:8px 10px;background:var(--bg);font-size:13px}
.res li .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:12px;background:var(--line)}
.res li.ok{background:var(--trust-soft)} .res li.ok .ic{background:var(--trust)}
.res li.ng{background:var(--error-soft)} .res li.ng .ic{background:var(--error)}
.res .d{font-family:var(--mono);font-size:11px;color:var(--ink-2);overflow-wrap:anywhere;display:block;margin-top:2px}
.verdict{border-radius:10px;padding:12px 14px;font-weight:900;font-size:15px;display:flex;gap:8px;align-items:center}
.verdict.ok{background:var(--trust);color:#fff}
.verdict.ng{background:var(--error);color:#fff}

.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--ink-2)}
td.mono{font-size:12px}
tr.me td{background:var(--accent-soft)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 14px;min-height:42px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
details.script summary{cursor:pointer;font-weight:900;list-style:none}
details.script summary::-webkit-details-marker{display:none}
pre{margin:8px 0 0;background:var(--code);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:11.5px;overflow-x:auto;line-height:1.5}

/* public verifier */
.entry{display:flex;flex-direction:column;gap:12px;align-items:stretch;max-width:520px;margin:28px auto 0;width:100%}
.entry h1{text-align:center}
.entry p{text-align:center;margin:0}
.entry form{display:flex;gap:8px}
.entry input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;min-height:48px;font-family:var(--mono)}
.entry .primary{width:auto;padding:0 20px}
.examples{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.examples a{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12.5px;padding:8px 14px;border-radius:999px;z-index:40;max-width:calc(100% - 32px);text-align:center}

@media (min-width:768px){
  :root{--gut:24px}
  body{background:var(--bg)}
  .app{max-width:none}
  .steps{grid-template-columns:repeat(3,1fr)}
}
@media (min-width:1024px){
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
}
</style>

const ALGO="bx-shuffle-v1（カード番号ランダム・ビーコンなし）";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function sha256(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}

const PY=`import hashlib
H = lambda s: hashlib.sha256(s.encode()).hexdigest()

def verify(server_seed, commit, participants_text, participants_hash, checklist, published):
    assert H(server_seed) == commit                    # ① コミットと一致
    assert H(participants_text) == participants_hash   # ② 参加者リストと一致
    lines = participants_text.split("\\n")
    final = H(server_seed + "|" + participants_hash + "|")   # この版は外部ビーコンなし
    arr = list(range(len(checklist)))
    for i in range(len(checklist) - 1, 0, -1):         # ③ カード番号リストを Fisher–Yates
        j = int(H(final + ":" + str(i))[:8], 16) % (i + 1)
        arr[i], arr[j] = arr[j], arr[i]
    got = {l: [] for l in lines}
    for k, idx in enumerate(arr):                      # ④ 枠に順番に配る
        got[lines[k % len(lines)]].append(checklist[idx])
    assert all(sorted(got[l]) == sorted(published[l]) for l in lines)
    return True`;

  const inputs=[item("シードのハッシュ（コミット・"+m.commitAt+" 公開）",d.commit),item("サーバーシード（"+m.drawAt+" に公開）",d.serverSeed),
    item("参加者リスト（購入順・1行1枠）",d.participantsText),item("参加者リストのハッシュ",d.participantsHash)];
  inputs.push(`<div class="item"><span class="k">カード番号リスト（出品時に固定・${d.checklist.length} 種）<button class="copy" type="button" data-copy="${esc(d.checklist.join("\n"))}">コピー</button></span><details><summary class="small">表示する</summary><span class="v">${esc(d.checklist.join(" "))}</span></details></div>`);
  inputs.push(`<div class="item"><span class="k">アルゴリズム</span><span class="v">${ALGO}：final = SHA-256(seed|participantsHash|)、カード番号リストを Fisher–Yates（j = SHA-256(final:i) 先頭 8 桁 mod (i+1)）で並べ替え、参加者リストの順に 1 枚ずつ配る</span></div>`);
  const rows=lines.map((l,k)=>{const me=l.startsWith(m.me+"#"), nums=d.slots[l];
    return `<tr class="${me?"me":""}"><td class="mono">#${String(k+1).padStart(2,"0")}</td><td class="mono">${esc(l.replace(/#\d+$/,""))}…${me?" （あなた）":""}</td>
      <td><details><summary class="small">${nums.length} 種</summary><span class="mono small">${nums.join("、")}</span></details></td></tr>`;}).join("");
  document.getElementById("main").innerHTML=`<div class="page">
    <section class="blk">
      <span class="mode">カード番号ランダム</span>
      <h1>${esc(m.title)}</h1>
      <div class="meta"><span>開封会 ID <b class="mono">${id}</b></span><span>満員 ${m.fullAt}</span><span>開封 ${m.openAt}</span></div>
      <div class="links"><button class="btn" type="button" id="share"><svg class="i"><use href="#i-share"/></svg>この検証ページを共有</button>
        ${m.video?`<a class="btn" href="ui-07-recording.html#${id}"><svg class="i"><use href="#i-video"/></svg>開封映像を見る</a>`:`<a class="btn" href="#video" data-proto="開封映像（${id}・開封前）"><svg class="i"><use href="#i-video"/></svg>開封映像（開封後に公開）</a>`}
        <a class="btn" href="#spec" data-proto="アルゴリズム仕様"><svg class="i"><use href="#i-doc"/></svg>アルゴリズム仕様</a></div>
    </section>
    <section class="blk"><h2>しくみ</h2><ol class="steps">
      <li><span class="n">1</span><span>販売開始前にシードのハッシュを公開</span></li>
      <li><span class="n">2</span><span>満員後に参加者リストを確定して公開</span></li>
      <li><span class="n">3</span><span>公開アルゴリズムでカード番号を各枠に割り当て → 誰でも再計算できます</span></li></ol>
      <p class="small muted" style="margin:0">割り当ては、販売前に約束したシードと公開した参加者リストから計算されています。この版では外部の公開乱数（ビーコン）を使っていません。今後の版で導入する予定です。</p></section>
    <div class="grid2">
      <section class="blk"><h2>入力（すべて公開）</h2><div class="kv">${inputs.join("")}</div></section>
      <div style="display:flex;flex-direction:column;gap:14px">
        <section class="blk run"><h2>ブラウザで再計算する</h2>
          <button class="primary" type="button" id="run">ブラウザで再計算する</button>
          <ul class="res" id="res" aria-live="polite"></ul><div id="verdict"></div>
          <label class="small muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="tamper">原型：改ざんされた値で試す（シードを 1 文字変更）</label></section>
        <section class="blk"><h2>割り当て（${m.drawAt} 公開）</h2><div class="tblwrap"><table><thead><tr><th>枠</th><th>保有者（匿名）</th><th>カード番号</th></tr></thead><tbody>${rows}</tbody></table></div></section>
      </div>
    </div>
    <section class="blk"><details class="script"><summary>検証スクリプト（Python）</summary>
      <p class="small muted" style="margin:6px 0 0">上の入力をそのまま渡すと、このページと同じ計算を手元で再現できます。</p>
      <pre id="py"></pre><button class="btn" type="button" id="copy-py" style="margin-top:8px">スクリプトをコピー</button></details></section>
  </div>`;

  document.getElementById("share").onclick=()=>copy(location.href,"ページの URL をコピーしました");
  document.getElementById("copy-py").onclick=()=>copy(PY,"スクリプトをコピーしました");
}

async function run(id){
  const d=DATA[id], tamper=document.getElementById("tamper").checked;
  const res=document.getElementById("res"), btn=document.getElementById("run"); btn.disabled=true; res.innerHTML=""; document.getElementById("verdict").innerHTML="";
  const seed=tamper?d.serverSeed.slice(0,-1)+"X":d.serverSeed; let allOk=true;
  const add=(ok,label,detail)=>{allOk=allOk&&ok;res.insertAdjacentHTML("beforeend",`<li class="${ok?"ok":"ng"}"><span class="ic">${ok?"✓":"✕"}</span><span>${label}<span class="d">${detail}</span></span></li>`);};
  const h1=await sha256(seed); add(h1===d.commit,"ハッシュ一致（シード → コミット）",`SHA-256(seed) = ${h1}`);
  const h2=await sha256(d.participantsText); add(h2===d.participantsHash,"参加者リスト一致",`SHA-256(list) = ${h2}`);
  const lines=d.participantsText.split("\n"), ids=d.checklist, fin=await sha256(seed+"|"+h2+"|"), arr=ids.map((_,i)=>i);
  for(let i=ids.length-1;i>0;i--){const j=parseInt((await sha256(fin+":"+i)).slice(0,8),16)%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];}
  const got={}; lines.forEach(l=>got[l]=[]); arr.forEach((idx,k)=>got[lines[k%lines.length]].push(ids[idx]));
  const bad=lines.findIndex(l=>got[l].slice().sort().join()!==d.slots[l].slice().sort().join());
  add(bad<0,"割り当て一致（全 "+lines.length+" 枠）",bad<0?`final = ${fin}`:`#${String(bad+1).padStart(2,"0")}：計算結果と公開されたカード番号が違います`);
  document.getElementById("verdict").innerHTML=allOk?`<div class="verdict ok">✓ 公開された結果と一致しました</div>`:`<div class="verdict ng">✕ 一致しない項目があります（詳細は上記）</div>`;
  btn.disabled=false;
}

async function copy(text,msg){try{await navigator.clipboard.writeText(text);say(msg);}catch(e){say("コピーできませんでした。手動で選択してください");}}
document.addEventListener("click",e=>{const c=e.target.closest("[data-copy]");if(c){copy(c.dataset.copy,"コピーしました");return;}
  const p=e.target.closest("[data-proto]");if(p){e.preventDefault();say(`原型：「${p.dataset.proto}」尚未生成`);}});
const toast=document.getElementById("toast"); let tt;
function say(m){toast.textContent=m;toast.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toast.hidden=true,2600);}
