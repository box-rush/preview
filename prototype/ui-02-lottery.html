<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- Box Rush 原型 UI-02 场次详情 + 规则快照。由 docs/breaking-platform.md §9.4 UI-02 prompt 生成；静态单文件，无需构建。
     用 #L001 / #L005 / #L002 / #L009 切换示例场次；第一版只做卡号随机（PD17），「ランダムで購入」跳转 ui-04-checkout.html。 -->
<title>BOXラッシュ 開封会詳細</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Tokens: docs/breaking-platform.md §9.2 (same as ui-01-home.html) */
:root{
  --hdr:61px; --gut:16px; --cta:112px;
  --ground:#EEEEE8;
  --bg:#FAFAF7; --surface:#FFFFFF; --ink:#1A1A1A; --ink-2:#6B6B6B; --line:#E6E5DE; --track:#ECEBE4;
  --accent:#3B3FD8; --accent-ink:#FFFFFF; --accent-soft:#ECEDFC;
  --trust:#0F9D8A; --trust-soft:#E1F3F0;
  --warn:#D98A00; --warn-soft:#FBF0DC; --error:#D14343;
  --gold:#C9A227;
  --shadow:0 1px 2px rgba(20,20,40,.06),0 4px 14px rgba(20,20,40,.05);
  --sans:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0A0B0C;
    --bg:#111214; --surface:#1A1B1E; --ink:#F2F2F2; --ink-2:#A0A0A0; --line:#2A2B2F; --track:#2A2B2F;
    --accent:#8E91F7; --accent-ink:#111214; --accent-soft:#23244A;
    --trust:#3CC4B0; --trust-soft:#15302C;
    --warn:#F0A73A; --warn-soft:#3A2C12; --error:#EF6B6B;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0A0B0C;
  --bg:#111214; --surface:#1A1B1E; --ink:#F2F2F2; --ink-2:#A0A0A0; --line:#2A2B2F; --track:#2A2B2F;
  --accent:#8E91F7; --accent-ink:#111214; --accent-soft:#23244A;
  --trust:#3CC4B0; --trust-soft:#15302C;
  --warn:#F0A73A; --warn-soft:#3A2C12; --error:#EF6B6B;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(var(--cta) + env(safe-area-inset-bottom,0px))}
.wrap{width:100%;max-width:1200px;margin-inline:auto}

/* prototype strip */
.proto{background:var(--ink);color:var(--bg);font-size:12px}
.proto summary{padding:6px 16px;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
.proto summary::-webkit-details-marker{display:none}
.proto summary::before{content:"▸";transition:transform .15s}
.proto[open] summary::before{transform:rotate(90deg)}
.proto .opts{padding:4px 16px 12px;display:flex;flex-direction:column;gap:8px}
.proto .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.proto .row>span{min-width:88px;opacity:.75}
.proto button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer}
.proto button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:6px;padding:10px var(--gut)}
.back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;margin-left:-8px}
.back:hover{background:var(--track)}
.mark{display:flex;align-items:baseline;gap:8px}
.mark b{font-weight:900;font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:1px}
.mark b i{font-style:normal;background:var(--accent);color:var(--accent-ink);padding:0 5px;border-radius:5px;margin-right:2px;font-family:var(--mono);font-size:16px;line-height:1.35}
.mark small{font-size:10px;letter-spacing:.18em;color:var(--ink-2);font-variant:small-caps;text-transform:lowercase}
.dnav{display:none}
.sp{flex:1}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;position:relative}
.icon-btn:hover{background:var(--track)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.crumbs{display:none}

/* layout */
.page{display:flex;flex-direction:column;gap:14px;padding-block:0 18px}
.col-media{display:flex;flex-direction:column}
.col-main{display:flex;flex-direction:column;gap:14px;padding:0 var(--gut)}

/* 1. gallery */
.gallery{position:relative}
.shots{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.shots::-webkit-scrollbar{display:none}
.shot{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:4/3;max-width:100%;position:relative;display:grid;place-items:center;overflow:hidden}
.shot .box{width:54%;aspect-ratio:1/1.08;border-radius:8px;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:7% 8%;color:#fff;box-shadow:10px 10px 0 rgba(0,0,0,.16)}
.shot .box small{font-size:11px;letter-spacing:.14em;opacity:.85}
.shot .box strong{font-size:17px;line-height:1.3;font-weight:900;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.shot .box em{font-style:normal;font-family:var(--mono);font-size:12px;font-weight:700;align-self:flex-end;background:rgba(0,0,0,.28);padding:1px 6px;border-radius:3px}
.shot .tape{position:absolute;left:-10%;right:-10%;top:47%;height:14px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 14px,rgba(255,255,255,.28) 14px 20px);transform:rotate(-8deg)}
.shot.side .box{transform:perspective(500px) rotateY(-28deg)}
.shot.close .box{width:120%;transform:rotate(-8deg) translateY(8%)}
.shot.close .tape{height:34px;top:44%}
.shot .lens{position:absolute;right:10px;top:10px;font-size:11px;background:rgba(0,0,0,.45);color:#fff;padding:2px 8px;border-radius:999px;font-family:var(--mono)}
.shot.poke{background:linear-gradient(160deg,#FFF3D1,#F6D58A)} .shot.poke .box{background:linear-gradient(160deg,#E76F51,#C2410C)}
.shot.op{background:linear-gradient(160deg,#DDE8F4,#A9C3DE)} .shot.op .box{background:linear-gradient(160deg,#2F4F7F,#16305A)}
.shot.ygo{background:linear-gradient(160deg,#EFE3EA,#CDB2C3)} .shot.ygo .box{background:linear-gradient(160deg,#6D597A,#3F2F4C)}
.cap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px var(--gut) 0;font-size:12px;color:var(--ink-2)}
.cap b{color:var(--trust);display:inline-flex;align-items:center;gap:4px}
.cap b svg{width:14px;height:14px;stroke-width:2.2}
.thumbs{display:flex;gap:6px}
.thumbs button{width:8px;height:8px;border-radius:4px;border:0;padding:0;background:var(--line);cursor:pointer}
.thumbs button[aria-current="true"]{background:var(--ink);width:20px}

/* blocks */
.blk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.blk h2{margin:0;font-size:15px;font-weight:900;display:flex;align-items:center;gap:6px}
.blk h2 .n{font-family:var(--mono);font-size:11px;color:var(--ink-2);font-weight:500}
.muted{color:var(--ink-2)}
.small{font-size:12px}

/* 2. title block (not a card) */
.head{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.head h1{margin:0;font-size:20px;font-weight:900;line-height:1.4;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink-2)}
.facts b{color:var(--ink);font-weight:500}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.tg{font-size:11px;border-radius:4px;padding:1px 7px;border:1px solid var(--line);color:var(--ink-2)}
.tg.self{border-color:transparent;background:var(--ink);color:var(--bg)}
.pricebig{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pricebig b{font-family:var(--mono);font-size:24px;font-weight:700}
.pricebig b small{font-family:var(--sans);font-size:13px}

/* 3. guarantee */
.guar{flex-direction:row;align-items:center;gap:12px;background:var(--trust-soft);border-color:color-mix(in srgb,var(--trust) 28%,transparent)}
.guar .gi{width:40px;height:40px;border-radius:10px;background:var(--surface);display:grid;place-items:center;color:var(--trust);flex:none}
.guar .gt{flex:1;display:flex;flex-direction:column;gap:2px}
.guar .gt b{font-size:15px}
.info{border:0;background:transparent;color:var(--trust);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.info:hover{background:color-mix(in srgb,var(--trust) 12%,transparent)}
.guar-more{font-size:12.5px;color:var(--ink);margin:0;flex-basis:100%}
.guar.open{flex-wrap:wrap}

/* 4. partition */
.slots{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.slot{border-bottom:1px solid var(--line)}
.slot summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;cursor:pointer;align-items:center}
.slot summary::-webkit-details-marker{display:none}
.slot .sn{font-weight:700;display:flex;align-items:center;gap:6px}
.slot .sn::before{content:"";width:6px;height:6px;border-right:1.8px solid var(--ink-2);border-bottom:1.8px solid var(--ink-2);transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
.slot[open] .sn::before{transform:rotate(45deg)}
.slot .sp2{font-family:var(--mono);font-weight:700;text-align:right}
.slot .sg{font-size:12px;color:var(--ink-2);padding-left:14px}
.slot .ss{font-size:11px;text-align:right}
.ss.sold{color:var(--ink-2)}
.ss.open{color:var(--accent);font-weight:700}
.cards{margin:0 0 10px 14px;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:12px;display:flex;flex-direction:column;gap:4px}
.cards .lab{font-size:11px;color:var(--ink-2)}
.cards ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 10px}
.cards li{font-family:var(--mono);font-size:11.5px}
.packgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.pk{border:1px solid var(--line);border-radius:6px;text-align:center;font-family:var(--mono);font-size:12px;padding:6px 0;background:var(--bg)}
.pk.sold{color:var(--ink-2);background:var(--track);border-color:transparent}
.fallback{font-size:12.5px;border-left:3px solid var(--line);padding:2px 0 2px 10px}
.fallback b{display:block;font-size:12px;color:var(--ink-2);font-weight:700}

/* 5. fill */
.bigtrack{height:12px;border-radius:6px;background:var(--track);overflow:hidden}
.bigtrack i{display:block;height:100%;background:var(--accent);border-radius:6px}
.fillrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.fillrow b{font-family:var(--mono);font-size:18px}
.refund{display:flex;gap:8px;align-items:flex-start;font-weight:700;font-size:13.5px}
.refund svg{color:var(--trust);margin-top:2px}

/* 6. fairness */
.hash{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.hash code{font-family:var(--mono);font-size:12.5px;flex:1;min-width:0;overflow-wrap:anywhere}
.copy{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;flex:none;min-height:32px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0}
.link{color:var(--accent);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px;align-self:flex-start}
.link:hover{text-decoration:underline}

/* 7. opening */
.opening .when{font-family:var(--mono);font-size:18px;font-weight:700}

/* 8. snapshot link */
.snaplink{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px dashed var(--line);border-radius:12px;padding:12px 16px;background:transparent;cursor:pointer;width:100%;text-align:left}
.snaplink:hover{border-color:var(--ink-2)}

/* sticky CTA */
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:color-mix(in srgb,var(--surface) 97%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px var(--gut) calc(10px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:6px}
.cta-row{display:flex;align-items:center;gap:10px}
.cta-price{display:flex;flex-direction:column;line-height:1.2;min-width:78px}
.cta-price small{font-size:11px;color:var(--ink-2)}
.cta-price b{font-family:var(--mono);font-size:19px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.stepper button{width:40px;height:44px;border:0;background:var(--surface);cursor:pointer;font-size:18px}
.stepper button:disabled{color:var(--line);cursor:not-allowed}
.stepper output{min-width:34px;text-align:center;font-family:var(--mono);font-weight:700}
.primary{flex:1;min-height:48px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:15px;cursor:pointer}
.primary:disabled{background:var(--track);color:var(--ink-2);cursor:not-allowed}
.cta-note{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 12px;font-size:11px;color:var(--ink-2)}

/* snapshot sheet */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:480px;max-height:86vh;border-radius:16px 16px 0 0;background:var(--surface);color:var(--ink)}
dialog.sheet::backdrop{background:rgba(0,0,0,.45)}
.sheet-h{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-size:15px;flex:1}
.sheet-b{padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px;font-size:13px}
.ro{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:var(--track);border-radius:4px;padding:1px 6px;color:var(--ink-2)}
.rules{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px}
.rules dt{color:var(--ink-2);font-size:12px;white-space:nowrap}
.rules dd{margin:0}

.toast{position:fixed;left:50%;bottom:calc(var(--cta) + 12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12.5px;padding:8px 14px;border-radius:999px;z-index:40;max-width:calc(100% - 32px);text-align:center}

/* tablet */
@media (min-width:768px){
  :root{--gut:24px}
  body{background:var(--bg)}
  .app{max-width:none}
  .cta{max-width:none}
  .cta-row,.cta-note{max-width:720px;margin-inline:auto;width:100%}
  .shot{aspect-ratio:16/9}
  .shot .box{width:30%}
  .shot.close .box{width:70%}
  .col-main{max-width:720px;margin-inline:auto;width:100%}
  .cap{max-width:720px;margin-inline:auto;width:100%}
  dialog.sheet{max-width:640px;margin:auto;border-radius:16px}
}
/* desktop: gallery left (sticky), content right */
@media (min-width:1024px){
  :root{--hdr:65px}
  .bar{padding-block:12px}
  .back{display:none}
  .dnav{display:flex;gap:4px;margin-left:28px}
  .dnav a{padding:8px 14px;border-radius:999px;color:var(--ink-2);font-weight:500}
  .dnav a:hover{background:var(--track);color:var(--ink)}
  .crumbs{display:flex;gap:6px;font-size:12px;color:var(--ink-2);padding:14px var(--gut) 0}
  .crumbs a:hover{color:var(--ink);text-decoration:underline}
  .page{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:32px;padding:18px var(--gut) 24px;align-items:start}
  .col-media{position:sticky;top:calc(var(--hdr) + 18px);border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
  .shot{aspect-ratio:1/1}
  .shot .box{width:52%}
  .shot.close .box{width:110%}
  .cap{padding:10px 14px 12px}
  .col-main{padding:0;max-width:none}
  .cta-row,.cta-note{max-width:1200px;padding-left:calc(((100% - 0px) * 5 / 11) + 32px)}
  .cta{padding-inline:var(--gut)}
}
@media (prefers-reduced-motion: reduce){ .slot .sn::before{transition:none} .shots{scroll-behavior:auto} }
</style>
<style>body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
</head>

<div class="app">
  <details class="proto">
    <summary>原型 UI-02 场次详情 · 示例数据 · 原型时钟 2026-09-26 18:00 JST · 点此切换</summary>
    <div class="opts">
      <div class="row"><span>示例场次</span>
        <button type="button" data-sample="L001" aria-pressed="true">番号随机 · 12 枠</button>
        <button type="button" data-sample="L005" aria-pressed="false">番号随机 · 16 枠</button>
        <button type="button" data-sample="L002" aria-pressed="false">番号随机 · 30 枠</button>
        <button type="button" data-sample="L009" aria-pressed="false">已结束</button>
      </div>
      <div class="row"><span>参考价格（PD2 A/B）</span>
        <button type="button" id="ab-on" aria-pressed="true">显示</button>
        <button type="button" id="ab-off" aria-pressed="false">不显示</button>
      </div>
    </div>
  </details>

  <header class="top">
    <div class="bar wrap">
      <a class="back" href="ui-01-home.html" aria-label="ホームに戻る"><svg class="i"><use href="#i-back"/></svg></a>

        <h2 id="h-part">分け方 <span class="n">${PT[l.partitionType]} · ${total}枠${l.selectionMode==="PICK"?" · 枠を選んで購入":" · ランダム購入"}</span></h2>
        ${slotList}
        <div class="fallback"><b>リスト外のカードの扱い</b>${esc(l.fallbackRule)}</div>
      </section>

      <section class="blk" aria-labelledby="h-fill">
        <h2 id="h-fill">販売状況</h2>
        <div class="bigtrack" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${sold}" aria-label="販売済み ${sold}/${total} 枠"><i style="width:${pct}%"></i></div>
        <div class="fillrow"><span><b class="num">${sold}/${total}</b> 枠 販売済</span><span class="small muted num">販売締切 ${jst(l.saleEndsAt)}</span></div>
        <div class="refund"><svg class="i"><use href="#i-refund"/></svg><span>満員にならなければ全額返金<br><span class="small muted" style="font-weight:400">締切までに全枠が売れない場合、開封せずに元の支払い方法へ返金します。</span></span></div>
      </section>

      <section class="blk" aria-labelledby="h-fair">
        <h2 id="h-fair"><svg class="i" style="color:var(--trust)"><use href="#i-shield"/></svg>抽選シード（コミット）</h2>
        <div class="hash"><code id="hash" title="${l.seedCommitHash}">${l.seedCommitHash}</code><button class="copy" type="button" id="copy">コピー</button></div>
        <dl class="kv"><dt>コミット日時</dt><dd class="num">${jst(l.seedCommittedAt)}</dd><dt>販売開始</dt><dd class="num">${jst(l.saleStartsAt)}</dd></dl>
        <p class="small muted" style="margin:0">販売開始前にシードのハッシュを公開しています。満員後の割り当ては、このシードと公開する参加者リストから計算され、誰でも再計算できます。</p>
        <a class="link" href="#fairness" data-proto="公正性の仕組み">公正性の仕組み<svg class="i" style="width:14px;height:14px"><use href="#i-chev"/></svg></a>
      </section>

      <section class="blk opening" aria-labelledby="h-open">
        <h2 id="h-open"><svg class="i"><use href="#i-clock"/></svg>開封予定</h2>
        <span class="when num">${jst(l.openingAt)}</span>
        <p class="small" style="margin:0">開封は予定時刻に実施。視聴しなくても権利は変わりません。</p>
        <p class="small muted" style="margin:0">開封はすべて録画し、あとから何度でも確認できます。</p>
      </section>

      <button class="snaplink" type="button" id="snap-open"><span style="display:flex;gap:10px;align-items:center"><svg class="i"><use href="#i-doc"/></svg><span><b>ルール全文（上架時スナップショット）</b><br><span class="small muted num">${jstFull(l.snapshotAt)} 固定・変更不可</span></span></span><svg class="i"><use href="#i-chev"/></svg></button>
    </div>`;

  /* CTA */
  const limit=Math.min(l.purchaseLimit,total-sold); if(state.qty>Math.max(limit,1)) state.qty=Math.max(limit,1);
  let action;
  if(!onSale) action=`<button class="primary" type="button" disabled>販売終了</button>`;
  else if(l.selectionMode==="PICK") action=`<button class="primary" type="button" id="buy">枠を選ぶ</button>`;
  else action=`<div class="stepper" role="group" aria-label="購入枠数">
      <button type="button" id="dec" aria-label="1枠減らす" ${state.qty<=1?"disabled":""}>−</button><output id="qty" aria-live="polite">${state.qty}</output>
      <button type="button" id="inc" aria-label="1枠増やす" ${state.qty>=limit?"disabled":""}>＋</button></div>
      <button class="primary" type="button" id="buy">ランダムで購入</button>`;
  const shown = l.selectionMode==="RANDOM"&&onSale ? yen(minP*state.qty) : yen(minP)+(uniform?"":"〜");
  document.getElementById("cta").innerHTML=`
    <div class="cta-row"><div class="cta-price"><small>${l.selectionMode==="RANDOM"&&onSale?`${state.qty}枠 合計`:"1枠"}</small><b class="num">${shown}</b></div>${action}</div>
    <div class="cta-note"><span>満員にならなければ全額返金</span><span>購入後のキャンセルはできません</span>${onSale?`<span>1人 ${l.purchaseLimit} 枠まで</span>`:""}</div>`;
  bind(l,limit);
}

function bind(l,limit){
  const shots=document.getElementById("shots"), thumbs=document.getElementById("thumbs");
  thumbs.addEventListener("click",e=>{const i=[...thumbs.children].indexOf(e.target);if(i>=0) shots.scrollTo({left:shots.children[i].offsetLeft-shots.children[0].offsetLeft,behavior:"smooth"});});
  shots.addEventListener("scroll",()=>{const i=Math.round(shots.scrollLeft/shots.clientWidth);[...thumbs.children].forEach((b,k)=>b.setAttribute("aria-current",k===i));},{passive:true});
  const gb=document.getElementById("guar-btn"),gm=document.getElementById("guar-more"),g=document.getElementById("guar");
  gb.onclick=()=>{const open=gm.hidden;gm.hidden=!open;gb.setAttribute("aria-expanded",open);g.classList.toggle("open",open);};
  document.getElementById("copy").onclick=async e=>{const b=e.currentTarget;
    try{await navigator.clipboard.writeText(l.seedCommitHash);b.textContent="コピーしました";}
    catch(err){const r=document.createRange();r.selectNodeContents(document.getElementById("hash"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="選択しました";}
    setTimeout(()=>b.textContent="コピー",1600);};
  document.getElementById("snap-open").onclick=()=>openSheet(l);
  const buy=document.getElementById("buy");
  if(buy) buy.onclick=()=>{ if(l.selectionMode==="PICK"){ location.href="ui-03-pick.html#"+l.id; return; } location.href="ui-04-checkout.html#"+l.id+"-r"+state.qty; };
  const dec=document.getElementById("dec"),inc=document.getElementById("inc");
  if(dec) dec.onclick=()=>{state.qty=Math.max(1,state.qty-1);render();};
  if(inc) inc.onclick=()=>{state.qty=Math.min(limit,state.qty+1);render();};
}

const sheet=document.getElementById("sheet");
function openSheet(l){
  const total=l.slots.length;
  const rows=[
    ["開封会ID",`<span class="mono">${l.id}</span>`],
    ["対象商品",`${esc(l.title)}（${l.sealedUnit} × ${l.quantity}・メーカー未開封品）`],
    ["出品者",esc(l.merchantName)],
    ["分け方",`${PT[l.partitionType]}・全 ${total} 枠・満員後の抽選でカード番号を各枠に配る`],
    ["価格","各枠 "+yen(l.slots[0].price)+"（全枠同額）"],
    ["カード番号リスト",`全 ${l.checklist.length} 種（出品時に固定）`],
    ["保証",`各枠 1 枚以上。0 枚の枠には保証カード「${esc(l.guaranteeCard.name)}」（参考価格 ${yen(l.guaranteeCard.ref)}）を 1 枚進呈。保証カードは入庫済みで ${l.guaranteeCard.stock} 枚を確保`],
    ["リスト外のカード",esc(l.fallbackRule)],
    ["成立条件","全枠が売れた場合のみ開封（100%）。販売者・運営は枠を購入しません。"],
    ["販売期間",`${jst(l.saleStartsAt)} 〜 ${jst(l.saleEndsAt)}`],
    ["抽選シード",`<span class="mono" style="overflow-wrap:anywhere">${l.seedCommitHash}</span>（${jst(l.seedCommittedAt)} 公開）`],
    ["開封予定",`${jst(l.openingAt)}（予定時刻に実施・全編録画）`],
    ["キャンセル","購入後のキャンセルはできません。"],
    ["返金","不成立（締切までに満員にならない）・開封中止（録画の中断を含む）の場合、元の支払い方法へ全額返金します。"],
    ["カードの状態","初期不良（印刷ズレ等）を含め、開封した状態のままお渡しします。"],
    ["受け取り","カードは倉庫で保管され、まとめて発送を依頼できます。"]
  ];
  document.getElementById("sheet-body").innerHTML=`<p class="small muted" style="margin:0">出品時（${jstFull(l.snapshotAt)}）に固定したルールです。出品後は販売者・運営とも変更できません。</p>
    <dl class="rules">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
  if(sheet.showModal) sheet.showModal(); else sheet.setAttribute("open","");
}
document.getElementById("sheet-close").onclick=()=>sheet.close?sheet.close():sheet.removeAttribute("open");
sheet.addEventListener("click",e=>{if(e.target===sheet) sheet.close();});

const toast=document.getElementById("toast"); let tt;
function say(m){toast.textContent=m;toast.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toast.hidden=true,2200);}
document.addEventListener("click",e=>{const p=e.target.closest("[data-proto]");if(p){e.preventDefault();say(`原型：「${p.dataset.proto}」尚未生成`);}});

/* prototype controls */
document.querySelectorAll("[data-sample]").forEach(b=>b.onclick=()=>{state.id=b.dataset.sample;state.qty=1;
  document.querySelectorAll("[data-sample]").forEach(x=>x.setAttribute("aria-pressed",x===b));render();scrollTo(0,0);});
function setAB(on){state.showRef=on;document.getElementById("ab-on").setAttribute("aria-pressed",on);document.getElementById("ab-off").setAttribute("aria-pressed",!on);
  try{localStorage.setItem("br-ab-ref",on?"on":"off")}catch(e){} render();}
document.getElementById("ab-on").onclick=()=>setAB(true);
document.getElementById("ab-off").onclick=()=>setAB(false);
document.querySelectorAll("[data-sample]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.sample===state.id));
setAB(state.showRef);
</script>
</body>
</html>
